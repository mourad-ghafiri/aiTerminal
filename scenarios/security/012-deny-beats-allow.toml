name = "deny wins over allow, whatever the order"
tags = ["guard", "security"]

# A allow-list that could override a deny would make the deny-list advisory.

[setup]
allow = ["^git\\b"]
deny = ["--force"]

[[step]]
check = "git status"
[[step]]
expect_verdict = "allow"

[[step]]
check = "git push --force"
[[step]]
expect_verdict = "deny"
