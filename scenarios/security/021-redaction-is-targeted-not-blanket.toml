name = "redaction is targeted — ordinary values pass through"
tags = ["redaction"]

# If it masked everything that looked like configuration, the AI would lose the context
# it needs to be useful.

[setup]
redact_ai = ["AKIA[0-9A-Z]{16}"]

[[step]]
redact = "DATABASE_URL=postgres://db.internal/prod and LOG_LEVEL=debug"
scope = "ai"

[[step]]
expect_text = "DATABASE_URL=postgres://db.internal/prod and LOG_LEVEL=debug"
