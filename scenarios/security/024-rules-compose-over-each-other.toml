name = "rules compose, each running over the previous one's output"
tags = ["redaction"]

# This is why `ANTHROPIC_API_KEY=sk-...` collapses to `ANTHROPIC_«redacted»`: the key
# rule masks the value, then the KEY=value rule takes the name with it. Over-redacting
# is the safe direction, but it should not be a surprise.

[setup]
redact_ai = ["sk-[A-Za-z0-9_-]{8,}", "(?i)(api[_-]?key|token)[\"']?\\s*[:=]\\s*\\S+"]

[[step]]
redact = "ANTHROPIC_API_KEY=sk-ant-example-only-not-a-key"
scope = "ai"

[[step]]
expect_text = "ANTHROPIC_«redacted»"
