name = "text with nothing to hide comes back untouched"
tags = ["redaction", "performance"]

# This runs on every PTY chunk, so the common case has to be free.

[setup]
redact_ai = ["AKIA[0-9A-Z]{16}", "sk-[A-Za-z0-9_-]{16,}"]

[[step]]
redact = "cargo build --release"
scope = "ai"
[[step]]
expect_text = "cargo build --release"
