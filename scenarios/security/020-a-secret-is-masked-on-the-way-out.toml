name = "a secret is masked on the way out"
tags = ["redaction", "security"]

# The value keeps the SHAPE the rule matches — that is the whole point of the test —
# but carries no entropy, so it reads as a placeholder rather than as a credential.

[setup]
redact_ai = ["AKIA[0-9A-Z]{16}"]

[[step]]
redact = "AWS_ACCESS_KEY_ID=AKIAEXAMPLEONLY00000"
scope = "ai"

[[step]]
expect_not_text = ["AKIAEXAMPLEONLY00000"]

[[step]]
expect_text = "AWS_ACCESS_KEY_ID=«redacted»"
