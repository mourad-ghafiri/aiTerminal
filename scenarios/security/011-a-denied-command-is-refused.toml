name = "a denied command is refused, and says which rule refused it"
tags = ["guard", "security"]

# The command below is only ever a STRING here. The world has no shell and no process:
# `check_command` is pure policy over text.

[setup]
deny = ["rm\\s+-rf\\s+/"]

[[step]]
check = "rm -rf /"
[[step]]
expect_verdict = "deny"
[[step]]
expect_reason = ["rm"]
