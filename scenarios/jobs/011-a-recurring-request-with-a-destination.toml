name = "a recurring request keeps its destination"
tags = ["jobs", "ai"]

# The example this feature was built from. "every hour" is an interval, not a clock time,
# and the file path is part of the task — it must survive into the record intact.

[[step]]
model_says = """{"when":{"kind":"every","every_seconds":3600},"task":"summarize the latest kafka logs into ~/reports/kafka.md","says":"every hour — summarize the latest kafka logs into ~/reports/kafka.md"}"""

[[step]]
job = ["summarize the latest kafka logs into ~/reports/kafka.md every hour"]

[[step]]
expect_schedule = "every 1h"

[[step]]
expect_next = "2026-03-10 13:00"

[[step]]
expect_task = "summarize the latest kafka logs into ~/reports/kafka.md"
