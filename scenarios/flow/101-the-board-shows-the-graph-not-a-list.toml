name = "the board draws the graph: nodes that run together sit together"
tags = ["flow", "ui"]

# The whole reason to declare a graph rather than a chain is that independent work
# overlaps. A flat list of rows throws that away — three reviews and a summary read as
# four things in a queue. So a node's DEPTH decides its column: what runs first is on the
# left, what runs at the same time stacks in one column, and the arrows only ever point
# the way the work moves. You see the shape before you read a word.

[[step]]
flow = """
[[node]]
id     = "map"
agent  = "explorer"
prompt = "Map it"

[[node]]
id     = "correctness"
agent  = "reviewer"
needs  = ["map"]
prompt = "Correctness of {{map.output}}"

[[node]]
id     = "security"
agent  = "reviewer"
needs  = ["map"]
prompt = "Security of {{map.output}}"

[[node]]
id     = "report"
agent  = "reviewer"
needs  = ["correctness", "security"]
when   = "correctness.passed"
final  = true
prompt = "Merge {{correctness.output}} and {{security.output}}"
"""

# Before anything runs: every node is a card, the capability surface is stated, and the
# node that is waiting says what is holding it.
[[step]]
expect_graph_view_contains = ["╭─", "╰─", "○ map", "○ correctness", "@explorer", "4 nodes", "2 agents", "when correctness.passed", "0/4 done"]

# The cards are joined, and the run's whole shape is on one line — including the chain
# that decides the wall clock, which on a graph that overlaps work is not the slowest
# node and cannot be read off the picture.
[[step]]
expect_graph_view_contains = ["▸", "slowest path"]

# `correctness` and `security` are one rank, so they share a column: same left edge,
# different rows. That IS the claim in this scenario's name, asserted on geometry rather
# than on which glyph the renderer happened to pick.
[[step]]
expect_nodes_share_a_column = ["correctness", "security"]

[[step]]
node_says = ["map: the map", "correctness: looks right", "security: no leaks", "report: agreed"]

[[step]]
run = true

# And after: the same cards, in the same places, carrying what each one cost. A node's
# card never moves — that is what makes a repainting board readable at all.
[[step]]
expect_graph_view_contains = ["✓ map", "✓ correctness", "✓ security", "✓ report", "3.4k", "4/4 done"]
