name = "a run in a pipe or a background job stays legible and attributed"
tags = ["flow", "ui"]

# On a terminal the run is a board that repaints in place. A pipe, a `--bg` job log and
# CI have no cursor to move, so the same state machine prints one line per event —
# every one of them saying which node it belongs to, which is the thing a plain stream
# of interleaved output could never do.

[[step]]
flow = """
[[node]]
id     = "map"
agent  = "explorer"
prompt = "Map it"

[[node]]
id     = "left"
agent  = "reviewer"
needs  = ["map"]
prompt = "Look at {{map.output}}"

[[node]]
id     = "right"
agent  = "reviewer"
needs  = ["map"]
prompt = "Look at {{map.output}}"

[[node]]
id     = "join"
agent  = "reviewer"
needs  = ["left", "right"]
final  = true
prompt = "Merge {{left.output}} and {{right.output}}"
"""

[[step]]
node_fails = ["right"]

[[step]]
run = true

# Every node accounted for, by name: the two that ran together, the one that failed,
# and the one that could not follow it. `join` carries no condition of its own, so the
# ordinary rule applies — a failed dependency stops it.
[[step]]
expect_board_lines = ["[map] done", "[left] done", "[right] failed", "[join] blocked"]

# And on a terminal, the same four facts as a picture. The board used to draw a blocked
# node exactly as it drew a node that had not started — so once `right` failed, `join` sat
# at `○ waiting` on a run that had already finished, and the tally said `2/4 done` with no
# hint that anything had gone wrong at all.
[[step]]
expect_graph_view_contains = ["✗ right", "⊘ join", "1 failed", "1 blocked"]

# A failed card's third line is WHY it stopped, not what it cost. The cost of a failure is
# the least interesting thing about it, and it was the only thing shown.
[[step]]
expect_graph_view_contains = ["it failed"]

[[step]]
expect_list_view_contains = ["✗ right", "⊘ join", "1 failed", "1 blocked"]

# Nothing is left claiming to be on its way.
[[step]]
expect_graph_view_excludes = ["○"]
