name = "a secret rule guards what leaves, and says so only when it also guards the screen"
tags = ["config", "guard"]

# The default scope is egress. That is what keeps `cat .env` showing you your own
# values while the model never sees them — a rule that masked the display by default
# would be hiding a secret from the one person entitled to it.

[[step]]
config = ["[[guard.secret]]", "pattern = \"a\"", "[[guard.secret]]", "pattern = \"b\"", "scope = \"terminal\""]

[[step]]
expect = "ai,terminal"
field = "guard_secret_scopes"
