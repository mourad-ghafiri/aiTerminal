name = "plan mode withdraws the writing tools"
tags = ["workspace", "guard"]

# /plan narrows the toolset to the safe set, and a write the model attempts
# anyway comes back inert — "not available", not run.

[setup]
home = "ws-plan"

[[step]]
model_says_in_turn = ["@tool fs.write {\"path\":\"x.txt\",\"content\":\"hi\"}", "I could not write — plan mode."]

[[step]]
type = ["/plan", "note down hi into x.txt"]

[[step]]
open = "now"

[[step]]
turn = 2
expect_request_contains = ["not available to this agent"]
