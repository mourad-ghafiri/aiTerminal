name = "colours a program sets survive into the grid"
tags = ["style"]

# The renderer, `/shot` and the AI context all read colour off the cell — if SGR is
# dropped here, every one of them shows the wrong thing.

[[step]]
feed = "<ESC>[31mR<ESC>[0mP"

[[step]]
expect_cell = "R"
row = 0
col = 0
fg = "red"

[[step]]
expect_cell = "P"
row = 0
col = 1
fg = "default"
