name = "secrets are redacted before they leave the machine"
tags = ["guard", "security", "redaction"]

[setup]
paired = true
redact = ["AKIA[0-9A-Z]{16}"]

[[step]]
chat = "cat .env"
[[step]]
shell_start = true
[[step]]
pty = "AWS_ACCESS_KEY_ID=AKIA3RJHF2P9QLXMZB4T<CR><LF>LOG_LEVEL=debug<CR><LF>"
[[step]]
shell_end = 0

[[step]]
expect_not_says = ["AKIA3RJHF2P9QLXMZB4T"]

[[step]]
expect_says = ["redacted", "LOG_LEVEL=debug"]
