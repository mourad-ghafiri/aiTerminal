name = "secrets are redacted before they leave the machine"
tags = ["guard", "security", "redaction"]

# The key on the wire keeps the SHAPE the rule matches and none of the entropy: a
# placeholder, not something a reader (or a secret scanner) could mistake for real.

[setup]
paired = true
redact = ["AKIA[0-9A-Z]{16}"]

[[step]]
chat = "cat .env"
[[step]]
shell_start = true
[[step]]
pty = "AWS_ACCESS_KEY_ID=AKIAEXAMPLEONLY00000<CR><LF>LOG_LEVEL=debug<CR><LF>"
[[step]]
shell_end = 0

[[step]]
expect_not_says = ["AKIAEXAMPLEONLY00000"]

[[step]]
expect_says = ["redacted", "LOG_LEVEL=debug"]
