name = "a secret leaves as a placeholder your phone can still use"
tags = ["guard", "security", "vault"]

# The value on the wire keeps the SHAPE the rule matches and none of the entropy: a
# placeholder, not something a reader (or a secret scanner) could mistake for real.
#
# The second half is the point of a REVERSIBLE placeholder. Your phone gets «secret-1»,
# sends a command back carrying it, and the terminal runs that command with the real
# value in it — so you can use a key from a device that has never seen it.

[setup]
paired = true
redact = ["AKIA[0-9A-Z]{16}"]

[[step]]
chat = "cat .env"
[[step]]
expect_pty = "cat .env<CR>"
[[step]]
shell_start = true
[[step]]
pty = "AWS_ACCESS_KEY_ID=AKIAEXAMPLEONLY00000<CR><LF>LOG_LEVEL=debug<CR><LF>"
[[step]]
shell_end = 0

[[step]]
expect_not_says = ["AKIAEXAMPLEONLY00000"]

[[step]]
expect_says = ["secret-1", "LOG_LEVEL=debug"]

[[step]]
chat = "aws configure set key «secret-1»"

[[step]]
expect_pty = "aws configure set key AKIAEXAMPLEONLY00000<CR>"
