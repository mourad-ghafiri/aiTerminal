name = "hiding is targeted, so the model keeps enough context to be useful"
tags = ["guard", "secrets"]

# Over-redacting is the safe direction and a useless one: a model handed nothing but
# placeholders cannot help you. Only what matches leaves.

[[setup.guard.secret]]
pattern = "AKIA[0-9A-Z]+"
name = "aws-key"

[[step]]
hide = "DATABASE_URL=postgres://db.internal/prod AWS_ACCESS_KEY_ID=AKIAEXAMPLEONLY00000 LOG_LEVEL=debug"

[[step]]
expect_not_text = ["AKIAEXAMPLEONLY00000"]

[[step]]
expect_kept = ["postgres://db.internal/prod", "LOG_LEVEL=debug"]
