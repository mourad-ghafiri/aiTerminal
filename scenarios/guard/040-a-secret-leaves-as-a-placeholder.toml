name = "a secret leaves as a placeholder named after its rule"
tags = ["guard", "secrets"]

# The value below keeps the SHAPE the rule matches — that is the whole point of the
# test — but carries no entropy, so it reads as a placeholder rather than a credential.

[[setup.guard.secret]]
pattern = "AKIA[0-9A-Z]+"
name = "aws-key"

[[step]]
hide = "AWS_ACCESS_KEY_ID=AKIAEXAMPLEONLY00000"

[[step]]
expect_not_text = ["AKIAEXAMPLEONLY00000"]

[[step]]
expect_text = "AWS_ACCESS_KEY_ID=«aws-key-1»"
