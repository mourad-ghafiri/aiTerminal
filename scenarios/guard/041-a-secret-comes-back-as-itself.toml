name = "a secret comes back as itself the moment the text returns"
tags = ["guard", "secrets", "vault"]

# The half that makes redaction usable rather than merely safe. Without it a run that
# reads a key can no longer use it, which is why people turned redaction off.

[[setup.guard.secret]]
pattern = "pw-[a-z0-9]+"
name = "db-password"

[[step]]
hide = "DB_PASSWORD=pw-example0"
[[step]]
expect_text = "DB_PASSWORD=«db-password-1»"

[[step]]
restore = true
[[step]]
expect_text = "DB_PASSWORD=pw-example0"
