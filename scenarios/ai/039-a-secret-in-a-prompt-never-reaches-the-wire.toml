name = "a secret in a prompt never reaches the wire"
tags = ["ai", "guard", "secrets"]

# The tool runner hides every RESULT on its way back to the model. A prompt does not go
# through it — and a prompt is not always the user's words: a flow node's is filled from an
# upstream command's output, and a loop's carries the verifier's. So the assertion here is
# on the request body the harness actually posted, encoded by the real request builder.
#
# The value keeps the shape the rule matches and none of the entropy.

[setup]
secrets = ["pw-[a-z0-9]+"]

[[step]]
model_says = "I have noted it."

[[step]]
ask = "the staging password is pw-example0 — what should I check first?"

[[step]]
expect_request_excludes = ["pw-example0"]

[[step]]
expect_request_contains = ["what should I check first"]
