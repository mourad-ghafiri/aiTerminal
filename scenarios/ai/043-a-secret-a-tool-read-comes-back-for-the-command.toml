name = "a secret a tool read comes back for the command that needs it"
tags = ["ai", "guard", "secrets", "vault"]

# The whole round trip in one journey: a tool reads a config file, the value leaves as a
# placeholder, the model writes a command using the placeholder, and the machine puts the
# real value back. The model is never sent the secret and the work still works.

[setup]
secrets = ["pw-[a-z0-9]+"]

[[step]]
tool = "fs.read"
[[step]]
tool_returns = ["fs.read=DB_PASSWORD=pw-example0"]

[[step]]
model_says_in_turn = ["@tool fs.read {\"path\":\".env\"}", "The database password is in .env; connect with `psql postgres://app:«secret-1»@db.internal/prod`."]

[[step]]
agent = "how do I connect to the database?"

# The value never went out…
[[step]]
expect_request_excludes = ["pw-example0"]
turn = 2

# …and what came back names the placeholder, which is what the machine substitutes.
[[step]]
expect_answer_contains = ["«secret-1»"]
