name = "a failed step stops the flow instead of building on an error"
tags = ["ai", "flow", "robustness"]

# Later steps must never run on top of a failure — a "review" of an error message is
# worse than no review. The failed step keeps its error as its answer, so the user can
# see which step died and why, and the remaining steps are never attempted.

[[step]]
model_fails = "500 internal error"

[[step]]
flow = ["plan: design it", "build: write it", "review: check it"]

[[step]]
expect_steps_ran = ["plan"]

[[step]]
expect_answer_contains = ["500 internal error"]
