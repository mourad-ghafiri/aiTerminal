name = "a plugin can add guard rules, in the same vocabulary a config file uses"
tags = ["plugins", "guard"]

# This is how the shipped defaults arrive: the whole guard policy is a plugin, so you
# can read it, edit it, or remove it. A plugin can only ever ADD a restriction.

[[step]]
plugin = ["name = \"ai-guard\"", "[[guard.command]]", "pattern = \"wipe-the-lot\"", "rule = \"deny\"", "[[guard.secret]]", "pattern = \"AKIA\\\\w+\""]

[[step]]
expect_denied = ["wipe-the-lot"]

[[step]]
expect_secrets = ["AKIA\\w+"]
