# aiTerminal — configuration (TOML)
# Edit and reload live with Cmd-, (or restart). Missing keys use defaults.
# Seeded into ~/.aiTerminal/config.toml on first run; yours is never overwritten.
#
# This is the GLOBAL config. A PROFILE can override any of these keys for itself: each
# profile keeps a config.toml under ~/.aiTerminal/profiles/<id>/ that layers on top of this
# file (theme, ai, plugins, keymaps, security…). Manage profiles from the terminal with
# `@profile` (list/create/rename/delete/switch) — each profile also remembers its own
# tabs/splits (workspace). See docs/configuration.md.

[appearance]
# The theme collection (semantic colors over neutral chrome): midnight (default),
# graphite, alpine, deep-purple, pink, product-red, gold, sunset, cosmic-orange, sage,
# lavender, mist-blue, sky-blue (light), light-gold (light), titanium, solar-flare,
# nebula, coral, starlight (light) — or a custom themes/<name>.toml
theme       = "midnight"
locale      = "en"         # language for the terminal's own strings — an i18n/<locale>.toml
                           # (en + fr ship in builtin/i18n; add your own file to override)
font_family = "Menlo"      # any installed monospace font
font_size   = 13           # base point size
cursor_style = "block"     # block (classic filled cell) | bar (thin caret) | underline

[behavior]
zoom       = 1.0           # default zoom multiplier (per split, adjust with Cmd +/-)
tab_bar    = "top"         # top | bottom (horizontal) · left/vertical | right (vertical)
                           # — or cycle live with Cmd-Alt-T
shell      = ""            # leave empty to use $SHELL
scrollback = 10000         # terminal history lines kept for scrollback (Shift+PageUp/↑/
                           # Home scroll up; the mouse wheel scrolls too; typing snaps
                           # back to the live bottom)

# Ask before closing. The dialog is keyboard- and mouse-driven: esc cancels, ←/→ (or
# Tab) move between the buttons, ↵ chooses the focused one, and a click works on both.
# CANCEL holds focus when it opens — a hand that hit ⌘Q by accident hits ↵ next, and
# that has to keep the session rather than end it.
#
# Closing the LAST split, or the last tab, ends the session — so it asks the quit
# question and obeys confirm_quit, whatever the other two say.
confirm_close_pane = false # a split is cheap to reopen, and closing one is deliberate
confirm_close_tab  = true  # a tab can hold several splits and their running shells
confirm_quit       = true  # ⌘Q sits beside ⌘W and takes everything with it
                           # NOTE: the red close button and the menu's Quit item are
                           # NOT covered — macOS tears the window down before the app
                           # can ask, so those two stay immediate.

[md]
# How Markdown renders (`@md render`, `@md edit`, and every AI answer).
syntax         = true      # syntax-highlight fenced code blocks
image_max_rows = 20        # the tallest an inline image may be drawn, in grid rows
remote_images  = false     # fetch https:// images (badges, screenshots) when rendering.
                           # Off by default: displaying a document should never reach the
                           # network on its own. Local image files always draw.

[jobs]
# Tracked background work (`@job`). A recurring job keeps one log per occurrence.
max_concurrent = 4         # how many jobs may run at once, so a fleet of due work can
                           # never fork-bomb the machine
keep_runs      = 20        # per-occurrence logs a job keeps (older ones are pruned)
max_log_bytes  = 1048576   # cap on a single run's log, so an hourly job can't fill the disk

[loop]
# `@loop` — iterating an agent until a verifiable goal passes.
max           = 5       # default iteration cap (--max overrides it)
timeout       = "30m"   # default wall clock for a whole run (--timeout overrides it)
check_timeout = "10m"   # how long one verifier command may take before it is killed
keep_runs     = 20      # loop records kept on disk
propose_check = true    # with no --check, let the AI propose a real verifier command from
                        # the goal (the command guard still has to allow it). Off → an
                        # unverified goal is graded by an independent reviewer agent.

[flow]
# `@flow` — a workflow declared as a GRAPH of nodes (agent runs, shell commands,
# approvals) rather than a list of steps. Nodes that need nothing from each other run
# at the same time, so `concurrency` is the one that changes how it feels.
concurrency  = 4       # nodes in flight at once (--concurrency overrides it)
timeout      = "30m"   # wall clock for a whole run (--timeout overrides it)
node_timeout = "10m"   # how long any single node may take before it is cut off
keep_runs    = 20      # flow run records kept on disk
max_map      = 32      # ceiling on a `map` node's fan-out, so a list nobody bounded
                       # cannot become a thousand agent runs
view         = "graph" # how a run is watched and drawn. "graph" shows the shape — one
                       # band per wave of work, so what runs together looks like it —
                       # and "list" shows one dense row per node. `--view` overrides it
                       # per command.

# Custom keybindings — rebind any built-in action (snake_case; full list of action
# names in docs/keybindings.md). Uncomment and add [[keybinding]] tables:
# [[keybinding]]
# key    = "cmd+shift+x"   # chord: cmd/ctrl/alt/shift + key (matches the keycap on any layout)
# action = "split_down"    # e.g. split_down, go_to_tab_3, next_tab, tab_switcher

[ai]
# The AI engine is model- and provider-INDEPENDENT — no vendor is assumed. Models are
# self-describing: each ai/models/<provider>.toml file declares its provider
# (kind/base_url/key env) ONCE, then a [models.<id>] table per model with that model's
# full definition (sampling params, capabilities, context window, pricing). The bundled
# files (anthropic, openai, openrouter, deepseek, groq, grok, qwen, kimi, minimax,
# ollama, lmstudio, local) are a reference catalog — pick ANY of them, or any provider.
#
# AI is OFF until you declare a model. Scroll to "MODELS" at the end of this section
# and uncomment one block — that is the whole setup.

# Let `@ai` / agents see your FOCUSED terminal pane's recent session (commands +
# output, secrets redacted) so they can resolve "it"/"that" — e.g. after `mkdir x`,
# `@ai go into it` → `cd x`. Default true; set false to send only your request.
share_terminal_context = true

# Memory — a structured, retrieval-based memory the AI recalls automatically
# (a from-scratch BM25 ranker; model-agnostic, no DB). Each run the most relevant
# memories are injected into the AI context, and agents curate their own store via
# the memory.* tools. Stored as plain Markdown files in ~/.aiTerminal/ai/memory/.
# Default true (auto-recall on); set false to disable injection — tools still work.
memory = true

# Show the model's raw reasoning/"thinking" text while it works. Default false — only an
# animated "∴ thinking…" indicator is shown (tool calls and the final answer still stream).
# Set true to see the full chain-of-thought.
show_reasoning = false

# ── Context ───────────────────────────────────────────────────────────────────
# Every run measures its context against the window of the model serving it and
# compacts before that model would refuse the turn. Compaction is a ladder: big tool
# results are written to a file and replaced by a preview + the path (free — no model
# call, and `fs.read` fetches the full text back on demand); only if that is not
# enough does it spend one call folding the oldest turns into a summary. Agents can
# also drive it themselves with `ctx.status` and `ctx.compact`.
#
# context_window — the window to budget against, in tokens. 0 (default) uses whatever
# the serving model declares in ~/.aiTerminal/ai/models/*.toml. Set it when the model
# file cannot know the truth — a local model served with a smaller window than its
# card claims. For a MIXED pool, set `context_window` on the individual model entry
# instead (see the pool examples below), so a 32k local model and a 200k hosted one
# each budget against their own window.
context_window = 0

# compact_at — the fraction of the usable window that triggers compaction. Lower
# compacts sooner (safer on a small window, more summaries); higher runs closer to the
# edge. Anything outside 0.1–0.95 falls back to the default.
compact_at = 0.75

# How a shell `@ai <request>` suggestion is applied:
#   "manual" (default) — preload the command for review; press Enter (or edit) to run.
#   "auto"             — run a guard-ALLOWED suggestion immediately. A guard-*confirm*
#                        command (e.g. `rm -rf`) always drops to review either way, so
#                        auto can never silently run a risky command.
mode = "manual"

# Whether AI tools may reach the network (web.read / net.get / http.*). Off → agents
# get a clear "network is disabled" error instead of egress.
network = true

# Optional USD spend soft-cap. When set, every run's footer shows its estimated cost
# against it (e.g. "· 12% of $0.10") and a run that exceeds it gets a ⚠ note. ADVISORY
# only — it never blocks a run (the @loop `--budget` flag is a separate hard token cap).
# Needs the chosen model's price_in/price_out (the bundled cloud models ship them).
# budget = 0.50


# ══ MODELS ════════════════════════════════════════════════════════════════════
# Every request — @ai, @<agent>, @flow, @loop — draws one model from this pool.
# Add as many [[ai.model]] blocks as you like; each request picks one by `weight`.
#
# `api_key` takes three forms — pick whichever suits you:
#   api_key = "sk-…"                 the key itself
#   api_key = "$MY_KEY"              read from that environment variable
#   (omit it)                        read the provider's own variable, e.g.
#                                    $ANTHROPIC_API_KEY · $OPENAI_API_KEY ·
#                                    $OPENROUTER_API_KEY · $DEEPSEEK_API_KEY
# Local providers (ollama, lmstudio) need no key at all.
#
# ── Get started: uncomment ONE block, set `id` + your key ──────────────────────
# [[ai.model]]
# provider = "openrouter"                       # any provider (see ai/models/*.toml)
# id       = "deepseek/deepseek-chat"           # any model that provider serves
# api_key  = "sk-or-v1-…"                       # or omit → $OPENROUTER_API_KEY
#
# `weight` is optional — one model always serves 100% of requests.

# ── A pool of several models (and providers) ──────────────────────────────────
# `weight` is each model's share; omit it and a model gets a full 100. Give every
# block its own key when mixing providers. Sampling settings are optional too —
# leave them out and the model's catalog defaults apply.
#
# [[ai.model]]                # ~10% of requests — keep the pricey one rare
# provider    = "anthropic"
# id          = "claude-opus-4-8"
# api_key     = "$ANTHROPIC_API_KEY"   # read from the environment
# weight      = 10
# temperature = 0.3           # 0.0–1.0, lower is more deterministic
# max_tokens  = 8000          # response cap (clamped 1–200000)
# thinking    = true          # force extended thinking on/off
#
# [[ai.model]]                # ~90% — the everyday workhorse
# provider    = "openrouter"
# id          = "deepseek/deepseek-chat"
# api_key     = "sk-or-v1-…"
# weight      = 90
# top_p       = 0.95          # nucleus sampling
# top_k       = 40            # top-k sampling
#
# [[ai.model]]                # a local model needs no key
# provider = "ollama"
# id       = "llama3.1"
# weight   = 10

# ── How the pool picks (optional) ─────────────────────────────────────────────
# Default is "weighted". Uncomment to change it — and keep it ABOVE your
# [[ai.model]] blocks, since a bare key always joins the table declared above it.
#
# [ai.balance]
# strategy = "weighted"       # weighted (default) | round_robin | cost | failover


[gates]
# `@gate` — hand a split to a chat app and drive this terminal from your phone.
# `@gate telegram start` spawns a shell in the pane and relays it: you keep typing
# locally while a PAIRED chat drives the SAME shell (same cwd, same history, same
# running program). Every remote action is echoed in the pane, so nothing is hidden.
#
# This is remote code execution over a chat app. It is OFF until you turn it on, and
# a chat must send the one-time pairing code printed at `start` before it can do
# anything at all. See docs/gate.md before enabling.
enabled          = false
require_pairing  = true    # a chat must send the 6-digit code first. Turning this off
                           # trusts `allow` alone — only do that on a machine you own.
plain_text       = "run"   # what a plain (non-slash) message means:
                           #   "run"    — execute it, subject to the [security] guard
                           #   "ignore" — do nothing; require an explicit /run
screenshot       = "document"  # how /shot arrives: "document" (the PNG byte-for-byte)
                               # or "photo" (the chat app recompresses — small text blurs)
max_reply_messages   = 3   # messages one command's output may span before it is
                           # truncated with a pointer to /full (1–20)
attach           = true    # when an interactive program takes the terminal (Claude Code,
                           # Codex, vim, a python/psql REPL), show its live screen in the
                           # chat and type your messages into it instead of running them
                           # as shell commands. Detected from the terminal protocol
                           # itself, so it works for any program. false = shell only.
idle_timeout_minutes = 0   # stop a gate after this long with no remote traffic; 0 = never

# ── The gateways ──────────────────────────────────────────────────────────────
# One table per channel. Keep these BELOW the keys above: a bare key always joins
# the table declared above it. Telegram ships today; more channels slot in here.
#
# Create a bot by messaging @BotFather on Telegram (`/newbot`), then either paste
# the token here or — better — keep it out of the file:
#   token = "123456:AA…"          the token itself
#   token = "$TELEGRAM_BOT_TOKEN" read it from that environment variable
#
# [gates.telegram]
# token = "$TELEGRAM_BOT_TOKEN"
# allow = []                # chat ids that skip pairing, e.g. [51234903]. Empty (the
#                           # default) means EVERY chat must pair — the safe posture.

[plugins]
enabled  = true            # master switch for the whole declarative plugin system
# Every plugin in ~/.aiTerminal/plugins/<name>/plugin.toml loads automatically
# (the builtins — git, dir, common, … — are seeded here on first run). Their shell
# aliases (g, gst, ll, ..) + status segments are active when integration is on.
disabled = []              # turn specific plugins off, e.g. ["git"]

[shell]
integration = true         # master switch: inject the plugins' aliases + shell snippets
                           # (completion, autosuggest, history, prompt, alias-hints —
                           # each a builtin PLUGIN you can disable/remove in Management)
                           # + theme file-type ls colors. Off → a bare, untouched shell.

[registry]
# Where the builtin plugins/themes/AI/keymaps are seeded FROM. Empty = auto-resolve
# a bundled `builtin/` (next to the binary, or the repo in dev). The builtins are
# seeded into ~/.aiTerminal/ on first run; updates land here.
dir = ""

[logging]
# Diagnostic logging to ~/.aiTerminal/logs/ — ONE file per day (logs/YYYY-MM-DD.log),
# written on a background thread (never blocks the UI) and auto-pruned by age.
# level: off | error | warn | info | debug | trace   (default: error)
level          = "error"
# How many daily log files to keep; older ones are pruned on rollover. 0 = keep all.
retention_days = 7

[security]
# Command guard — what AI-suggested commands and agent `sys.run` may run. Patterns are regex.
# Defaults below (empty) = everything allowed, nothing denied (zero friction).
#   allowed_commands : OPTIONAL whitelist — enforced only when non-empty.
#   denied_commands  : ALWAYS enforced, and WINS over the allow-list.
allowed_commands = []      # e.g. ["^git\\b", "^ls\\b", "^cd\\b"]
denied_commands  = []      # e.g. ["^sudo\\b"]
confirm_commands = []      # ask before running, e.g. ["\\bforce\\b"]  (deny > confirm > allow)
# The AI's Auto-mode SAFE-LIST: the only commands the agent auto-runs un-prompted in Auto
# mode (anything else prompts). Defaults ship in the `command-guard` plugin; add yours here.
auto_safe_commands = []    # e.g. ["^docker\\s+ps\\b", "^kubectl\\s+get\\b"]

# Redaction — replace string/regex matches with a placeholder before they are
# shown or sent. scope = "terminal" | "ai" | "all" (default "all").
# Add rules as top-level [[redact]] tables, e.g.:
# [[redact]]
# pattern     = "token=\\S+"     # regex (or set literal = true for an exact string)
# replacement = "token=«hidden»"
# scope       = "ai"             # only redact when sending to the AI
