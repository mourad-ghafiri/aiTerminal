# Français — doit définir exactement le même ensemble de clés que en.toml
# (le test de parité CI l'exige).

[switcher]
placeholder = "tapez un numéro ou un nom…"

[confirm]
pane_title = "Fermer cette division ?"
pane_button = "Fermer la division"
tab_title = "Fermer cet onglet ?"
tab_button = "Fermer l'onglet"
quit_title = "Quitter aiTerminal ?"
quit_button = "Quitter"
cancel = "Annuler"
tabs_one = "1 onglet"
tabs_other = "{n} onglets"
splits_one = "1 division"
splits_other = "{n} divisions"
stake_quit = "{0} · {1} seront fermés"
stake_tab = "{0} de cet onglet seront fermées"
stake_pane = "le shell qui s'y exécute sera arrêté"
hint = "échap annuler · ←→ déplacer · ↵ choisir"

[trust]
open_button = "Ouvrir avec la config du projet"
decline_button = "Config globale seulement"
hint = "échap garde la config globale · ←→ déplacer · ↵ choisir · /trust redemande"

[profile]
list_header = "profils dans {0} ({1}) :"
switch_hint = "changer :  @profile <id>   ·  réglages :  @profile edit   (une fenêtre ouverte suit en direct)"
switched = "profil '{0}' activé — une fenêtre ouverte l'applique en une seconde"

[job]
header = "tâches d'arrière-plan ({0}) :"
none = "aucune tâche — dites quoi faire et quand :  @job \"vérifier les logs à minuit\"  ·  une commande :  @job -- ./backup.sh"
cleared = "{0} tâche(s) terminée(s) supprimée(s)"

[agent]
header = "agents ({0}) :"
none = "aucun agent — ajoutez un .md sous {0}"
run_hint = "un en détail :  @agent <nom>   ·  en exécuter un :  @<nom> \"<tâche>\""

[flow]
header = "flux ({0}) :"
none = "aucun flux — ajoutez un .toml sous {0}"
run_hint = "exécuter :  @flow <nom> \"<entrée>\"   ·  vérifier d'abord :  @flow check <nom>   ·  visualiser :  @flow graph <nom>"
no_runs = "aucune exécution de flux — lancez-en une :  @flow <nom> \"<entrée>\""
runs_header = "exécutions de flux ({0}) :"
runs_hint = "une exécution :  @flow show <id>  ·  @flow log <id> [<nœud>] -f  ·  @flow resume <id>"
cleared = "{0} exécution(s) de flux terminée(s) supprimée(s)"
resume_hint = "reprendre là où elle s'est arrêtée :  @flow resume {0}"
node_hint = "un nœud :  @flow node {0} <nœud>  ·  sa sortie :  @flow log {0} <nœud>  ·  le relancer :  @flow retry {0} <nœud>"
watching = "suivi de {0} — l'affichage se met à jour à chaque nœud terminé"
building = "aucun flow nommé — construction d'un graphe pour cet objectif"
built = "graphe de {0} nœud(s) construit : {1} · @flow show {2}"
built_kept = "le graphe qu'il a tenté de construire est conservé :  @flow show {0}"

[theme]
switched = "thème '{0}' appliqué au profil '{1}' — une fenêtre ouverte se restyle en une seconde"
unknown = "aucun thème nommé '{0}'. disponibles : {1}"
switch_hint = "changer :  @theme <nom>   ·  exporter une référence :  @theme export <nom>"

[loop]
start = "boucle '{0}' — au plus {1} itération(s)"
iteration = "itération {0}/{1}"
verifier = "vérificateur : {0}"
already = "l'objectif est déjà atteint — rien à faire"
shift = "aucun progrès — on tente une approche vraiment différente"
done = "objectif atteint après {0} itération(s)"
stalled = "arrêt : aucun progrès — le vérificateur est revenu à un état déjà atteint"
exhausted = "arrêt : limite d'itérations atteinte sans réussir la vérification"
budget = "arrêt : budget de jetons épuisé"
timeout = "arrêt : temps écoulé"
resume_hint = "reprendre là où elle s'est arrêtée :  @loop resume {0}"
header = "boucles ({0}) :"
none = "aucune boucle — donnez-lui un objectif :  @loop \"faire passer les tests\""
cleared = "{0} boucle(s) terminée(s) supprimée(s)"
run_hint = "une boucle :  @loop show <id>  ·  @loop log <id> -f  ·  @loop resume <id>"
