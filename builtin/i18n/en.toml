# English — the base locale. Keys are referenced from the code via
# `i18n::translate("section.key")`; missing keys fall back to this file, then to
# the key string itself. Add a locale by dropping `i18n/<locale>.toml` here (the
# CI parity test requires it to define exactly this key set). Select with
# `[appearance] locale` in config.toml (per-profile overridable).

[switcher]
# The quick-switcher's empty-filter placeholder.
placeholder = "type a number or name…"

[confirm]
# The close-confirmation modal. Titles are questions; the confirm button says what it
# does rather than "OK", so a glance is enough to answer correctly.
pane_title = "Close this split?"
pane_button = "Close split"
tab_title = "Close this tab?"
tab_button = "Close tab"
quit_title = "Quit aiTerminal?"
quit_button = "Quit"
cancel = "Cancel"
# Counted fragments, composed into the stake lines below. A count is a real plural,
# not "tab(s)".
tabs_one = "1 tab"
tabs_other = "{n} tabs"
splits_one = "1 split"
splits_other = "{n} splits"
# What is at stake, counted from the live window — never guessed.
stake_quit = "{0} · {1} will close"
stake_tab = "{0} in this tab will close"
stake_pane = "the shell running in it will end"
hint = "esc cancel · ←→ move · ↵ choose"

[profile]
list_header = "profiles in {0} ({1}):"
switch_hint = "switch:  @profile <id>   ·  settings:  @profile edit   (a running window follows live)"
switched = "switched to profile '{0}' — a running window applies it within a second"

[job]
header = "background jobs ({0}):"
none = "no jobs yet — say what to do and when:  @job \"check the logs at midnight\"  ·  a command:  @job -- ./backup.sh"
cleared = "cleared {0} finished job(s)"

[agent]
header = "agents ({0}):"
none = "no agents — add a .md under {0}"
run_hint = "one in full:  @agent <name>   ·  run one:  @<name> \"<task>\""

[flow]
header = "flows ({0}):"
none = "no flows — add a .toml under {0}"
run_hint = "run one:  @flow <name> \"<input>\"   ·  prove it first:  @flow check <name>   ·  see it:  @flow graph <name>"
no_runs = "no flow runs yet — start one:  @flow <name> \"<input>\""
runs_header = "flow runs ({0}):"
runs_hint = "one run:  @flow show <id>  ·  @flow log <id> [<node>] -f  ·  @flow resume <id>"
cleared = "cleared {0} finished flow run(s)"
resume_hint = "carry on where it stopped:  @flow resume {0}"
node_hint = "one node:  @flow node {0} <node>  ·  its output:  @flow log {0} <node>  ·  run it again:  @flow retry {0} <node>"
watching = "watching {0} — it repaints as each node lands"

[theme]
switched = "theme '{0}' applied to profile '{1}' — a running window restyles within a second"
unknown = "no theme named '{0}'. available: {1}"
switch_hint = "switch:  @theme <name>   ·  export a reference:  @theme export <name>"

[loop]
start = "loop '{0}' — up to {1} iteration(s)"
iteration = "iteration {0}/{1}"
verifier = "verifier: {0}"
already = "the goal is already met — nothing to do"
shift = "no progress — trying a materially different approach"
done = "goal reached after {0} iteration(s)"
stalled = "stopped: no progress — the verifier returned to a state it had already reached"
exhausted = "stopped: iteration limit reached without passing the check"
budget = "stopped: token budget exhausted"
timeout = "stopped: out of time"
resume_hint = "carry on where it stopped:  @loop resume {0}"
header = "loops ({0}):"
none = "no loops yet — give one a goal:  @loop \"make the tests pass\""
cleared = "cleared {0} finished loop(s)"
run_hint = "one run:  @loop show <id>  ·  @loop log <id> -f  ·  @loop resume <id>"
